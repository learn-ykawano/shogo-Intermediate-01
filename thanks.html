<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせありがとうございます | CareSend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-blue: #2E7CA6;
      --color-blue-dark: #1F5C7E;
      --color-blue-soft: #EAF3F8;
      --color-white: #FFFFFF;
      --color-gray: #F6F5F2;
      --color-black: #2B2B2B;
      --color-accent: #F0A69E;
      --font-display: 'Zen Maru Gothic', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--color-black);
      background: linear-gradient(180deg, var(--color-gray) 0%, var(--color-white) 55%);
      min-height: 100vh;
    }

    .thanks-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ーーー ヘッダー ーーー */
    .thanks-header {
      padding: 28px clamp(20px, 5vw, 64px);
    }

    .thanks-header__logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: var(--color-blue-dark);
      letter-spacing: .02em;
    }

    /* ーーー メインエリア ーーー */
    .thanks-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px clamp(20px, 5vw, 64px) 80px;
      position: relative;
      overflow: hidden;
    }

    /* 背景の柔らかい浮遊シェイプ（控えめな装飾。1箇所だけの大胆な要素は署名アイコン側に譲る） */
    .thanks-bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .5;
      pointer-events: none;
    }

    /* ーーー サンクスカード（既存の.case__contentと同じ「左上・右下」非対称の角丸を踏襲）ーーー */
    .thanks-card {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      background: var(--color-white);
      border-top-left-radius: 48px;
      border-bottom-right-radius: 48px;
      box-shadow: 0 12px 32px rgba(43, 43, 43, 0.12);
      padding: clamp(40px, 6vw, 64px) clamp(28px, 6vw, 56px) clamp(48px, 6vw, 64px);
      text-align: center;
    }

    /* ーーー 署名要素：完了を描き切るチェックマーク ーーー */
    .thanks-check {
      width: 92px;
      height: 92px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--color-blue-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thanks-check svg {
      width: 44px;
      height: 44px;
    }

    .thanks-check path {
      fill: none;
      stroke: var(--color-blue);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: draw-check .6s ease-out .3s forwards;
    }

    @keyframes draw-check {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .thanks-check path {
        animation: none;
        stroke-dashoffset: 0;
      }
    }

    .thanks-eyebrow {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .12em;
      color: var(--color-blue);
      margin: 0 0 12px;
    }

    .thanks-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(24px, 4vw, 30px);
      line-height: 1.6;
      color: var(--color-black);
      margin: 0 0 20px;
    }

    .thanks-text {
      font-size: 15px;
      line-height: 1.9;
      color: var(--color-black);
      margin: 0 0 8px;
    }

    .thanks-text+.thanks-text {
      margin-top: 4px;
    }

    .thanks-note {
      margin-top: 28px;
      padding: 16px 20px;
      background: var(--color-gray);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--color-black);
      text-align: left;
    }

    .thanks-note strong {
      color: var(--color-blue-dark);
    }

    .thanks-actions {
      margin-top: 36px;
      display: flex;
      justify-content: center;
    }

    .thanks-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 36px;
      background: var(--color-blue);
      color: var(--color-white);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(46, 124, 166, 0.32);
      transition: background .2s ease, transform .2s ease;
    }

    .thanks-button:hover {
      background: var(--color-blue-dark);
      transform: translateY(-1px);
    }

    .thanks-button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    .thanks-button svg {
      width: 16px;
      height: 16px;
    }

    .thanks-footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #8b8b8b;
    }

    @media (max-width: 480px) {
      .thanks-card {
        border-bottom-right-radius: 32px;
        border-top-left-radius: 32px;
      }

      .thanks-note {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="thanks-page">
    <main class="thanks-main">
      <span class="thanks-bg-shape thanks-bg-shape--1" aria-hidden="true"></span>
      <span class="thanks-bg-shape thanks-bg-shape--2" aria-hidden="true"></span>

      <section class="thanks-card">
        <div class="thanks-check" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 12.5 L9.5 18 L20 6" />
          </svg>
        </div>

        <p class="thanks-eyebrow">送信完了</p>
        <h1 class="thanks-title">
          お問い合わせ<br class="thanks-title__br">ありがとうございます
        </h1>
        <p class="thanks-text">この度はCareSendにお問い合わせいただき、誠にありがとうございます。</p>
        <p class="thanks-text">内容を確認のうえ、担当者より折り返しご連絡いたします。</p>

        <div class="thanks-note">
          <strong>ご連絡までの目安</strong>：2営業日以内<br>
          お急ぎの場合や、しばらく経ってもご連絡がない場合は、お手数ですがお電話にてお問い合わせください。
        </div>

        <div class="thanks-actions">
          <a class="thanks-button" href="index.html">
            トップページへ戻る
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
      </section>
    </main>

    <footer class="thanks-footer">
      &copy; CareSend
    </footer>
  </div>
</body>

</html>
